name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with Ruff
        run: |
          ruff check . --select E,F,W --ignore E501

      - name: Run Pytest Test Suite
        run: |
          python -m pytest tests/ -v --color=yes

  cms-ui-build:
    name: CMS UI Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cms-ui
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Build CMS UI
        run: |
          npm install
          npm run build

  viewer-ui-build:
    name: Viewer UI Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./viewer-ui
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Build Viewer UI
        run: |
          npm install
          npm run build
